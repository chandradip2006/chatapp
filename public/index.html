<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>

    <h1 style="text-align: center;">WELCOME TO CHATWORLD</h1>
    <label for="name">Enter Your Name:</label>
    <input type="text" id="name" placeholder="Enter your name...">
    <br>
    <br>
    <label for="password">Enter the password:</label>
    <input type="password" id="password" placeholder="Enter password...">
    <br>
    <br>
    <button id="startChatBtn">Start Chat</button>
    
    <script>
        const btn=document.getElementById('startChatBtn');
        const nameInput=document.getElementById('name');
        const passwordInput=document.getElementById('password');
        const KEY='12345678'
        btn.addEventListener('click', ()=>{
            const name = nameInput.value;
            if(name){
                if(passwordInput.value !== KEY) {
                    alert('Incorrect password! Please try again.');
                    return;
                }
                localStorage.setItem('name', name);
                window.location.href = 'app.html';
            } else {
                alert('Please enter your name to start chatting!');
            }
        });
    </script>
</body>
</html>
